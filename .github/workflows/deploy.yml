name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        run: npm run build
        env:
          # Set these as GitHub repository variables (Settings → Secrets and variables → Variables)
          PUBLIC_FORMBRICKS_ENV_ID: ${{ vars.PUBLIC_FORMBRICKS_ENV_ID }}
          PUBLIC_FORMBRICKS_SURVEY_ID: ${{ vars.PUBLIC_FORMBRICKS_SURVEY_ID }}
          PUBLIC_FB_Q_NAME: ${{ vars.PUBLIC_FB_Q_NAME }}
          PUBLIC_FB_Q_PHONE: ${{ vars.PUBLIC_FB_Q_PHONE }}
          PUBLIC_FB_Q_EMAIL: ${{ vars.PUBLIC_FB_Q_EMAIL }}
          PUBLIC_FB_Q_STUDENT: ${{ vars.PUBLIC_FB_Q_STUDENT }}
          PUBLIC_FB_Q_SUBJECT: ${{ vars.PUBLIC_FB_Q_SUBJECT }}
          PUBLIC_FB_Q_MESSAGE: ${{ vars.PUBLIC_FB_Q_MESSAGE }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
